openapi: 3.0.3
info:
  title: Sendgo API
  description: |
    **Sendgo** 알림 전송 API
    카카오 알림톡(Alimtalk), 브랜드메시지(Brand Message), SMS/LMS/MMS 전송을 지원합니다.

    > **친구톡은 2025-12-31 종료되었습니다.** 2026-01-01 부터 친구톡 발송 요청은
    > 카카오 측에서 브랜드메시지(자유형)로 자동 대체 발송됩니다.
    > `/{version}/friends/send` 는 자유 본문 타입(`FT`/`FI`/`FW`)의 발송 경로로
    > 계속 유지되며, 템플릿 기반 리치 타입·비친구 타게팅·동보 발송은
    > `/{version}/brand-messages/send` 를 사용하세요.

    ## 인증 방법
    1. **토큰 발급**: `accessKey:secretKey`를 Base64 인코딩하여 Basic 인증으로 토큰 요청
    2. **API 호출**: 발급받은 토큰으로 Bearer 인증
       - **v1**: `Authorization: Bearer base64(token)`
       - **v2**: `Authorization: Bearer token`

    토큰은 발급 후 **24시간** 동안 유효합니다. 응답의 `expiresAt`(v2) / `expires_at`(v1) 값을
    확인해 만료 전에 재발급하세요.

    ## 발송 API 와 관리 API

    - **발송 API** — 알림톡·브랜드메시지·문자·국제문자를 보냅니다. v1/v2 공통.
    - **관리 API** (v2 전용) — 카카오 채널(발신프로필) 등록, 알림톡 템플릿
      등록·검수 요청, 브랜드메시지 템플릿 관리, 발신번호 심사 접수,
      문자 템플릿 관리. 콘솔 화면에서만 되던 일을 코드로 처리합니다.

    관리 API 는 대부분 **즉시 완료되지 않습니다.** 템플릿 검수는 카카오가,
    발신번호는 sendgo 운영자가 심사합니다. 등록 호출이 성공했다는 것은
    "접수됐다"는 뜻이지 "쓸 수 있다"는 뜻이 아닙니다. 상태를 조회해 확인하세요.

    **sendgo.io 콘솔에 들어올 일이 없습니다.** 자기 서비스 화면만으로 고객의
    채널·발신번호·템플릿을 끝까지 처리할 수 있게 설계했습니다.

    사람이 개입하는 지점은 둘이지만, 둘 다 **여러분의 화면에서** 끝납니다.

    1. **카카오 채널 인증번호** — 카카오가 채널 관리자 휴대폰으로 SMS 를 보냅니다.
       사용자가 그 번호를 여러분 화면에 입력하면 됩니다. 카카오가 직접 하는
       확인이라 없앨 수 없습니다.
    2. **휴대폰 발신번호 명의 확인** — 콘솔은 PASS 를 쓰지만, API 는 **신분증
       사본을 받아 sendgo 운영자가 대신 심사**합니다. 여러분은 서류만 넘기면 됩니다.

    심사 결과는 `POST /{version}/webhook` 으로 구독해 받습니다 — 폴링하지 않아도
    됩니다.

    카카오 관련 관리 API 는 **기업(Team) 소유 애플리케이션**만 사용할 수 있습니다.
  version: "2.0"
  contact:
    name: Sendgo 개발팀
    url: https://sendgo.io
  license:
    name: MIT

servers:
  # 모든 공식 SDK 의 기본값은 `https://sendgo.io` 다. 스펙이 다른 호스트를 광고하면
  # 스펙으로 생성한 클라이언트와 SDK 가 서로 다른 곳을 보게 되므로 순서를 맞춰 둔다.
  - url: https://sendgo.io/api
    description: Sendgo API 서버 (정규 — SDK 기본값)

tags:
  - name: 계정
    description: >-
      조직 선택 · 애플리케이션 키 발급 · 허용 IP 관리 — v2 전용.
      애플리케이션 키 *이전* 단계이므로 에이전트 토큰으로 인증한다.
  - name: 인증
    description: 토큰 발급
  - name: 알림톡
    description: 카카오 알림톡 (Alimtalk) 전송
  - name: 친구톡
    description: >-
      카카오 친구톡 (Friendtalk) 전송 — **2025-12-31 종료됨(Deprecated)**.
      2026-01-01 부터 카카오 측에서 브랜드메시지(자유형)로 자동 대체 발송됩니다.
      신규 연동은 브랜드메시지를 사용하세요.
  - name: 브랜드메시지
    description: 카카오 브랜드메시지 (Brand Message) 전송 — 친구톡의 후속 채널. v2 전용
  - name: 문자
    description: SMS / LMS / MMS 전송
  - name: 짧은URL
    description: 짧은 URL 생성과 고객 반응(클릭) 분석
  - name: 발신프로필
    description: 카카오 채널(발신프로필) 인증 · 등록 · 동기화 — v2 전용
  - name: 알림톡템플릿
    description: 알림톡 템플릿 등록 · 수정 · 검수 요청 · 승인 취소 — v2 전용
  - name: 브랜드메시지템플릿
    description: 브랜드메시지(구 친구톡) 템플릿 등록 · 수정 · 동기화 — v2 전용
  - name: 발신번호
    description: 문자 발신번호 등록 · 심사 접수 · 관리 — v2 전용
  - name: 문자템플릿
    description: SMS/LMS/MMS 상용구 템플릿 — v2 전용
  - name: 카카오이미지
    description: 브랜드메시지·알림톡 이미지 업로드 — 카카오 호스팅 URL 발급. v2 전용
  - name: 수신거부
    description: 수신거부(080) 번호 조회 — v2 전용
  - name: 웹훅
    description: 등록·심사 결과를 밀어 주는 이벤트 구독 — v2 전용

paths:
  # ---------------------------------------------------------------------------
  # 계정 API — 애플리케이션 키 *이전* 단계
  #
  # 아래 경로만 인증 방식이 다르다. 에이전트 토큰(사람 계정에 매달린 개인
  # 액세스 토큰)으로 호출한다. 애플리케이션 키는 자기 자신을 만들 수 없으므로,
  # 조직 선택과 키 발급에는 한 단계 위의 자격증명이 필요하다.
  #
  # 콘솔에서 한 번 토큰을 만드는 것이 유일한 수동 단계다.
  # ---------------------------------------------------------------------------
  /{version}/account:
    get:
      tags: [계정]
      summary: 내 계정과 현재 조직
      description: |
        연동을 시작할 때 가장 먼저 부르는 호출입니다. 선택된 조직, 발급된 키의
        수와 승인 상태, 이 사이트에서 켜져 있는 채널, 그리고 **지금 무엇이
        막혀 있는지**(`nextSteps`)를 한 번에 돌려줍니다.

        `nextSteps` 는 사람에게 그대로 전달할 수 있는 문장입니다. 기업 승인
        대기, 키 승인 대기, 토큰 범위 부족처럼 코드로는 해결할 수 없는 이유가
        여기에 들어갑니다.
      operationId: getAccount
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      security:
        - AgentToken: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /{version}/account/organizations:
    get:
      tags: [계정]
      summary: 조직 목록
      description: |
        개인 계정과, 이 계정이 속한 기업 전부를 돌려줍니다. 개인 계정이 항상
        첫 항목입니다.

        `kakaoAvailable` 이 false 인 조직에서는 알림톡·브랜드메시지를 쓸 수
        없습니다 — 카카오는 승인된 기업 소유 애플리케이션만 허용합니다.
      operationId: listOrganizations
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      security:
        - AgentToken: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /{version}/account/organizations/select:
    post:
      tags: [계정]
      summary: 조직 선택
      description: |
        이후의 모든 호출이 이 조직을 기준으로 동작합니다. 발신번호·채널·템플릿·
        크레딧은 모두 조직에 매달려 있습니다.

        콘솔의 조직 전환기와 **같은 상태**를 바꿉니다. 즉 여기서 조직을 바꾸면
        같은 계정으로 열어 둔 콘솔 화면의 조직도 바뀝니다.
      operationId: selectOrganization
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      security:
        - AgentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organizationId:
                  type: string
                  nullable: true
                  description: 조직 uuid. `"personal"` 또는 null 이면 개인 계정으로 전환합니다.
                  example: personal
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /{version}/account/api-keys:
    get:
      tags: [계정]
      summary: 애플리케이션 키 목록
      description: |
        현재 조직의 키 전부와 각 키의 승인 상태·허용 IP 를 돌려줍니다.
        `secretKey` 는 가려진 값(`secretKeyMasked`)으로만 나옵니다.
      operationId: listApiKeys
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      security:
        - AgentToken: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [계정]
      summary: 애플리케이션 키 발급
      description: |
        고객 서비스 코드가 쓸 `accessKey`/`secretKey` 를 만듭니다.

        **`secretKey` 전문은 이 응답에서 한 번만 나옵니다.** 이후 조회에서는
        가려집니다. 받은 즉시 `SENDGO_SECRET_KEY` 로 저장하세요.

        사이트 설정에 따라 발급 직후 상태가 `PENDING` 일 수 있습니다. 그 경우
        운영자 승인 전까지 `POST /v2/token` 이 이 키를 거부합니다 — 발급이
        성공했다는 것이 "쓸 수 있다"는 뜻은 아닙니다.
      operationId: issueApiKey
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      security:
        - AgentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 20
                  description: 조직 안에서 유일한 키 이름
                  example: production
                ipAddresses:
                  type: array
                  description: |
                    허용 IP. **한 건이라도 등록하면 목록에 없는 IP 는 전부
                    차단됩니다.** 비워 두면 IP 제한이 걸리지 않습니다.
                  items:
                    type: object
                    required: [ip]
                    properties:
                      ip: { type: string, format: ipv4, example: 203.0.113.7 }
                      description: { type: string, maxLength: 255 }
      responses:
        '201':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /{version}/account/api-keys/{apiKeyId}:
    get:
      tags: [계정]
      summary: 애플리케이션 키 조회
      operationId: showApiKey
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/ApiKeyIdPath'
      security:
        - AgentToken: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [계정]
      summary: 애플리케이션 키 이름 변경
      operationId: updateApiKey
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/ApiKeyIdPath'
      security:
        - AgentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 20 }
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [계정]
      summary: 애플리케이션 키 폐기
      description: |
        되돌릴 수 없습니다. 이 키로 돌고 있는 고객 서비스는 즉시 401 을
        받습니다. 교체가 목적이라면 새 키를 먼저 발급해 배포한 뒤 폐기하세요.
      operationId: revokeApiKey
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/ApiKeyIdPath'
      security:
        - AgentToken: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /{version}/account/api-keys/{apiKeyId}/token:
    post:
      tags: [계정]
      summary: 이 키의 베어러 토큰 발급
      description: |
        `secretKey` 를 몰라도 키가 실제로 동작하는지 확인할 수 있게 해 줍니다.

        아직 유효한 토큰이 있으면 **그것을 그대로** 돌려줍니다. 새로 만들면
        이미 돌고 있는 고객 서버가 캐시한 토큰이 그 순간 무효가 되기 때문입니다.
      operationId: issueApiKeyToken
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/ApiKeyIdPath'
      security:
        - AgentToken: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /{version}/account/api-keys/{apiKeyId}/allowed-ips:
    get:
      tags: [계정]
      summary: 허용 IP 목록
      description: |
        `callerIp` 에 이 호출이 도착한 IP 가 들어 있습니다. 등록해야 할 값을
        모를 때 이 값을 쓰세요. `callerIpAllowed` 가 false 면 지금 이 IP 로는
        발송 API 가 차단됩니다.
      operationId: listAllowedIps
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/ApiKeyIdPath'
      security:
        - AgentToken: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [계정]
      summary: 허용 IP 추가
      description: |
        **첫 IP 를 등록하는 순간 IP 제한이 켜집니다.** 그 전까지는 제한이 없었고,
        등록 후에는 목록에 없는 모든 IP 가 `IP_NOT_ALLOWED` 로 막힙니다.
        운영 서버의 송신 IP 를 먼저 확인하고 등록하세요.
      operationId: addAllowedIp
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/ApiKeyIdPath'
      security:
        - AgentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ip]
              properties:
                ip: { type: string, format: ipv4, example: 203.0.113.7 }
                description: { type: string, maxLength: 255, example: production egress }
      responses:
        '201':
          $ref: '#/components/responses/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /{version}/account/api-keys/{apiKeyId}/allowed-ips/{allowedIpId}:
    delete:
      tags: [계정]
      summary: 허용 IP 삭제
      description: 마지막 IP 를 지우면 IP 제한이 다시 꺼집니다.
      operationId: removeAllowedIp
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/ApiKeyIdPath'
        - name: allowedIpId
          in: path
          required: true
          description: 허용 IP uuid
          schema: { type: string }
      security:
        - AgentToken: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /{version}/token:
    post:
      tags: [인증]
      summary: 액세스 토큰 발급
      description: |
        `accessKey:secretKey`를 Base64로 인코딩하여 Basic 인증 헤더로 전달하면 Bearer 토큰을 발급합니다.
        토큰 유효시간은 **24시간**입니다.
      operationId: issueToken
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      security:
        - BasicAuth: []
      responses:
        '200':
          description: 토큰 발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                data:
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /{version}/notices/send:
    post:
      tags: [알림톡]
      summary: 카카오 알림톡 전송
      description: |
        사전에 Sendgo 콘솔에서 승인받은 템플릿 코드를 사용하여 알림톡을 전송합니다.
        `replaceSms: "Y"` 설정 시, 알림톡 전송 실패 시 자동으로 SMS 대체 발송합니다.
      operationId: sendAlimtalk
      parameters:
