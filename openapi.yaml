      description: |
        카카오 채널 친구에게 친구톡을 전송합니다.
        이미지, 버튼, 광고성 메시지 등 다양한 형태를 지원합니다.

        > **Deprecated — 친구톡은 카카오 정책에 따라 2025-12-31 종료되었습니다.**
        > 2026-01-01 부터 이 엔드포인트로 들어온 발송 요청은 카카오 측에서
        > **브랜드메시지(자유형)** 로 자동 대체 발송됩니다. 호출은 계속 성공하지만
        > 실제로 나가는 것은 브랜드메시지입니다.
        >
        > **엔드포인트는 제거되지 않습니다.** 자유 본문 타입(`FT`/`FI`/`FW`)을 개별
        > 수신자에게 보내는 경로는 현재 이 엔드포인트뿐입니다 —
        > `/{version}/brand-messages/send` 는 같은 조합에 대해 `NOT_A_BRAND_MESSAGE`
        > 를 반환합니다.
        >
        > 다음의 경우에는 `/{version}/brand-messages/send` 를 사용하세요.
        > - 템플릿 기반 리치 타입 (`FL`/`FC`/`FM`/`FP`/`FA`)
        > - 채널 친구가 **아닌** 수신자 (`targeting` = `N` / `I`)
        > - 수신 동의한 전체 채널 친구 동보 (`targeting` = `F`)
        >
        > 대체 발송 자체를 원하지 않으면 친구톡 발송을 시도하지 말고
        > 문자(`/{version}/messages/send`)로 요청하세요.
