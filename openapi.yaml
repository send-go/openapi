  # ------------------------------------------------------------------ 관리 API
  # 아래 경로는 모두 **v2 전용**이다. 발송 API 와 달리 등록·심사 워크플로우를
  # 다루므로, 대부분 즉시 완료되지 않고 "접수 → 심사 → 승인" 상태를 거친다.

  /{version}/kakao-senders:
    get:
      tags: [발신프로필]
      summary: 발신프로필 목록
      description: 애플리케이션 소유 기업(Team)에 등록된 카카오 발신프로필을 모두 조회합니다.
      operationId: listKakaoSenders
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TeamRequired'
    post:
      tags: [발신프로필]
      summary: 발신프로필 등록 (2단계)
      description: |
        `POST /{version}/kakao-senders/token` 으로 받은 **인증번호**와 카테고리
        코드로 발신프로필을 만듭니다.

        이미 등록된 채널을 다시 등록하면 카카오가 같은 `senderKey` 를 돌려주며,
        sendgo 는 기존 행을 갱신합니다(중복 생성되지 않습니다).
      operationId: createKakaoSender
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KakaoSenderCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TeamRequired'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /{version}/kakao-senders/token:
    post:
      tags: [발신프로필]
      summary: 채널 인증 토큰 요청 (1단계)
      description: |
        카카오가 채널 관리자 휴대폰으로 **인증번호를 SMS 발송**합니다.
        응답에는 인증번호가 들어있지 않습니다 — 사람이 문자를 받아
        `POST /{version}/kakao-senders` 의 `token` 에 넣어야 합니다.

        즉 채널 등록은 완전 무인 자동화가 불가능합니다. 이 API 가 하는 일은
        "인증번호 발송을 코드로 트리거"하는 데까지입니다.
      operationId: requestKakaoSenderToken
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yellowId, phoneNumber]
              properties:
                yellowId:
                  type: string
                  description: 카카오톡 채널 검색용 아이디. `@` 는 있어도 없어도 됩니다.
                  example: '@sendgo'
                phoneNumber:
                  type: string
                  description: 채널 관리자 휴대폰 번호. 하이픈은 무시됩니다.
                  example: '01012345678'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TeamRequired'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

