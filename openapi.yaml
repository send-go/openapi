  /{version}/kakao-senders/{kakaoSenderKey}/sync:
    post:
      tags: [발신프로필]
      summary: 발신프로필 단건 동기화
      operationId: syncKakaoSender
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/KakaoSenderKeyPath'
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TeamRequired'
        '404':
          $ref: '#/components/responses/NotFound'

  /{version}/kakao-senders/{kakaoSenderKey}/brand-message/evidence:
    post:
      tags: [발신프로필]
      summary: 브랜드메시지 M/N — 수신동의 증적자료 업로드
      description: |
        브랜드메시지 마케팅(M) 타겟팅을 신청하기 전에, 광고성 정보 수신동의를
        받았다는 증적자료를 올려야 합니다. jpg/png, 5MB 이하.
      operationId: uploadBrandMessageEvidence
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/KakaoSenderKeyPath'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [evidence]
              properties:
                evidence:
                  type: string
                  format: binary
                  description: jpg 또는 png, 최대 5MB
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TeamRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /{version}/kakao-senders/{kakaoSenderKey}/brand-message/apply:
    post:
      tags: [발신프로필]
      summary: 브랜드메시지 M/N 사용 신청
      description: |
        `M`(마케팅) 또는 `N`(정보성) 타겟팅 사용을 신청합니다.
        `M` 은 증적자료 업로드가 선행돼야 합니다.

        결과는 즉시 확정되지 않습니다. 상태는 발신프로필의
        `brandMessageStatus`(`NOT_APPLIED` / `EVIDENCE_REQUIRED` / `APPROVED` /
        `REJECTED` / `REVOKED` / `BLOCKED`)로 확인합니다.
      operationId: applyBrandMessageTargeting
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/KakaoSenderKeyPath'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType]
              properties:
                targetType:
                  type: string
                  enum: [M, N]
                  description: M = 마케팅, N = 정보성
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TeamRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /{version}/template-folders:
    get:
      tags: [템플릿폴더]
      summary: 템플릿 폴더 트리와 개수 조회
      description: 조직 공유 폴더입니다. templateType과 발신프로필별로 개수를 집계하며 하위 폴더는 children에 포함됩니다. templateCount는 해당 폴더에 직접 속한 개수입니다.
      operationId: listTemplateFolders
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - name: templateType
          in: query
          schema: { type: string, enum: [notice, brand], default: notice }
        - name: kakaoSenderKey
          in: query
          schema: { type: string }
      security:
        - BearerAuth: []
      responses:
        '200':
          description: data.folders 폴더 트리, data.total 전체, data.uncategorised 미분류 개수
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      folders:
                        type: array
                        items: { $ref: '#/components/schemas/TemplateFolder' }
                      total: { type: integer }
                      uncategorised: { type: integer }
                      templateType: { type: string, enum: [notice, brand] }
                      kakaoSenderKey: { type: string, nullable: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TeamRequired'
    post:
      tags: [템플릿폴더]
      summary: 템플릿 폴더 생성
      description: 같은 조직 안에서 최대 5단계로 생성합니다. 같은 상위 폴더 아래 같은 이름은 409입니다. 반환된 data.folder.uuid를 템플릿 등록 시 folderUuid로 전달하세요.
      operationId: createTemplateFolder
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                parentUuid: { type: string, format: uuid, nullable: true }
      responses:
        '201':
          $ref: '#/components/responses/SuccessResponse'
        '403':
          $ref: '#/components/responses/TeamRequired'
        '404':
          description: 상위 폴더를 찾을 수 없음
        '409':
          description: TEMPLATE_FOLDER_NAME_EXISTS 같은 위치에 이름 중복
        '422':
          description: 입력 오류 또는 최대 깊이 초과

  /{version}/template-folders/templates:
    patch:
      tags: [템플릿폴더]
      summary: 알림톡 또는 브랜드메시지 템플릿 폴더 이동
      description: 최대 100개를 한 번에 이동합니다. folderUuid에 null을 명시하면 미분류로 이동합니다. templateCodes는 Sendgo templateCode이며 브랜드 제공사 코드는 아닙니다. 대상이 하나라도 없거나 다른 조직 소유이면 전체 요청이 실패합니다. 같은 폴더로 다시 이동해도 성공하며 changed는 0입니다. 심사 상태와 내용은 바뀌지 않습니다.
      operationId: moveTemplatesToFolder
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateType, kakaoSenderKey, templateCodes, folderUuid]
              properties:
                templateType: { type: string, enum: [notice, brand] }
                kakaoSenderKey: { type: string, maxLength: 255 }
                templateCodes:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { type: string, maxLength: 255 }
                folderUuid: { type: string, format: uuid, nullable: true }
      responses:
        '200':
          description: data에 folderUuid, templateType, matched(찾은 개수), changed(이동한 개수)를 반환
        '403':
          $ref: '#/components/responses/TeamRequired'
        '404':
          description: 폴더, 발신프로필 또는 템플릿을 찾을 수 없음 (변경 없음)
        '422':
          description: 입력 형식 오류

  /{version}/notice-templates:
    get:
      tags: [알림톡템플릿]
      summary: 알림톡 템플릿 목록
      operationId: listNoticeTemplates
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - name: kakaoSenderKey
          in: query
          schema: { type: string }
        - name: inspectionStatus
          in: query
          description: 'REG(등록) / REQ(심사요청) / APR(승인) / REJ(반려) / BLOCK / DORMANT'
          schema:
            type: string
            enum: [REG, REQ, APR, REJ, BLOCK, DORMANT]
        - name: folderUuid
          in: query
          description: 폴더 UUID 또는 미분류만 조회하려면 none. 생략하면 모든 폴더.
          schema: { type: string }
        - name: search
          in: query
          description: 템플릿명·코드·본문 부분 일치
          schema: { type: string }
        - name: count
          in: query
          schema: { type: integer, default: 30 }
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TeamRequired'
    post:
      tags: [알림톡템플릿]
      summary: 알림톡 템플릿 등록
      description: |
        템플릿을 만들고 카카오에 등록합니다. 등록 직후 상태는
        `status=R`, `inspectionStatus=REG` 이며, **아직 발송할 수 없습니다.**
        `POST /{version}/notice-templates/{templateCode}/inspection` 으로
        검수를 요청해 `APR` 이 되어야 발송 가능합니다.

        `templateEmphasizeType=IMAGE` 인 경우에는 `multipart/form-data` 로
        `image` 파일을 함께 보내야 하며, 이때 `buttons` 같은 배열 필드는
        JSON 문자열로 인코딩해 보내면 서버가 해석합니다.

        `messagePurpose`·`legalBasis`·`benefitOrigin`·`expiryType` 과 3종 확인
        필드는 sendgo 자체 정책 게이트입니다. API 라고 우회되지 않으며,
        통과하지 못하면 `POLICY_VALIDATION_FAILED` 로 거절됩니다.
      operationId: createNoticeTemplate
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticeTemplateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NoticeTemplateRequest'
      responses:
        '201':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TeamRequired'
        '422':
          $ref: '#/components/responses/PolicyValidationFailed'

  /{version}/notice-templates/categories:
    get:
      tags: [알림톡템플릿]
      summary: 템플릿 카테고리 코드 조회
      description: 등록 시 `categoryCode` 로 넣을 6자리 값 목록입니다.
      operationId: listNoticeTemplateCategories
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - name: categoryCode
          in: query
          schema: { type: string }
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TeamRequired'

  /{version}/notice-templates/{templateCode}:
    get:
      tags: [알림톡템플릿]
      summary: 알림톡 템플릿 조회
      description: 응답의 `data.template.policy` 에 정책 검토 상태와 미충족 사유가 들어 있습니다.
      operationId: showNoticeTemplate
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/TemplateCodePath'
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [알림톡템플릿]
      summary: 알림톡 템플릿 수정
      description: |
        발신프로필과 템플릿 코드는 바꿀 수 없습니다 — 카카오 쪽 식별자라
        바뀌면 예약된 캠페인이 끊깁니다.

        정책 필드만 바꾼 경우에는 카카오를 호출하지 않고 로컬만 갱신합니다.
        본문·버튼 등 카카오에 등록된 내용이 바뀌면 검수 상태가 되돌아가므로
        재검수를 요청해야 합니다.
      operationId: updateNoticeTemplate
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/TemplateCodePath'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticeTemplateRequest'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/PolicyValidationFailed'
    delete:
      tags: [알림톡템플릿]
      summary: 알림톡 템플릿 삭제 (sendgo 목록에서만)
      description: |
        **카카오는 템플릿 삭제 API 를 제공하지 않습니다.** 이 호출은 sendgo
        목록에서만 지우며, 비즈니스 채널 쪽 템플릿은 그대로 남습니다.
        동기화하면 다시 나타납니다.
      operationId: deleteNoticeTemplate
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/TemplateCodePath'
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /{version}/notice-templates/{templateCode}/sync:
    post:
      tags: [알림톡템플릿]
      summary: 템플릿 상태 동기화
      description: 카카오에서 검수 상태·반려 사유(`comments`)를 다시 읽어 옵니다.
      operationId: syncNoticeTemplate
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/TemplateCodePath'
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /{version}/notice-templates/{templateCode}/inspection:
    post:
      tags: [알림톡템플릿]
      summary: 검수 요청
      description: |
        `inspectionStatus` 가 `REG` 인 템플릿을 카카오 검수에 올립니다.
        요청이 접수되면 `REQ` 가 되고, 카카오 심사 후 `APR`(승인) 또는
        `REJ`(반려)로 바뀝니다. 결과는 즉시 오지 않으므로
        `/sync` 로 폴링하세요.

        sendgo 정책 검토를 통과하지 못한 템플릿은 `POLICY_REVIEW_REQUIRED`
        로 거절됩니다. 응답 `errors.reasons` 에 미충족 항목이 담깁니다.
      operationId: requestNoticeTemplateInspection
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/TemplateCodePath'
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  maxLength: 500
                  description: 심사자에게 전달할 문의사항
          multipart/form-data:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  maxLength: 500
                  description: 첨부파일이 있으면 필수입니다.
                attachments:
                  type: array
                  maxItems: 5
                  items:
                    type: string
                    format: binary
                  description: jpg/png/pdf, 각 5MB 이하. 증빙 자료
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/PolicyValidationFailed'
    delete:
      tags: [알림톡템플릿]
      summary: 검수 요청 취소
      description: 아직 심사 중(`REQ`)일 때만 가능합니다. 취소하면 `REG` 로 돌아갑니다.
      operationId: cancelNoticeTemplateInspection
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/TemplateCodePath'
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /{version}/notice-templates/{templateCode}/approval:
    delete:
      tags: [알림톡템플릿]
      summary: 승인 취소
      description: 이미 승인(`APR`)된 템플릿의 승인을 되돌립니다. 이후에는 발송할 수 없습니다.
      operationId: cancelNoticeTemplateApproval
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/TemplateCodePath'
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /{version}/notice-templates/{templateCode}/release:
    post:
      tags: [알림톡템플릿]
      summary: 휴면 해제
      description: 오래 사용하지 않아 `dormant` 로 잠긴 템플릿을 다시 활성화합니다.
      operationId: releaseNoticeTemplate
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/TemplateCodePath'
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /{version}/brand-templates:
    get:
      tags: [브랜드메시지템플릿]
      summary: 브랜드메시지 템플릿 목록
      operationId: listBrandTemplates
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - name: kakaoSenderKey
          in: query
          schema: { type: string }
        - name: folderUuid
          in: query
          description: 폴더 UUID 또는 미분류만 조회하려면 none. 생략하면 모든 폴더.
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: count
          in: query
          schema: { type: integer, default: 30 }
      security:
        - BearerAuth: []
      responses:
