      summary: 발신번호 등록 전 중복·형식 확인
      description: |
        같은 번호가 이미 있으면 등록은 가능하되 `duplicationReason` 이 필수가
        됩니다. 응답의 `duplicationReasonRequired` 로 미리 판단하세요.
      operationId: validateSenderNumber
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneE164, senderNumberType]
              properties:
                phoneE164:
                  type: string
                  example: '021234567'
                senderNumberType:
                  type: string
                  enum:
                    - personal_mobile
                    - personal_other
                    - team_main
                    - team_representative_mobile
                    - team_emp_mobile
                    - team_other_company
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

