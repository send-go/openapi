  /{version}/kakao-images/types:
    get:
      tags: [카카오이미지]
      summary: 업로드 가능한 이미지 유형과 제약
      description: |
        유형별로 필드 이름(`image` / `images[]`)과 최대 개수가 다릅니다.
        문서를 열지 않고도 확인할 수 있게 열어 둡니다.
      operationId: listKakaoImageTypes
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TeamRequired'

  /{version}/kakao-images/{type}:
    post:
      tags: [카카오이미지]
      summary: 카카오 이미지 업로드
      description: |
        브랜드메시지 템플릿의 `imageUrl` 은 아무 URL 이나 되는 게 아니라
        **카카오가 호스팅하는 URL** 이어야 합니다. 그 URL 을 얻는 방법이
        이 업로드뿐입니다.

        알림톡 본문 이미지는 템플릿 등록에 파일을 함께 실으면 되므로
        (`POST /{version}/notice-templates` 의 multipart) 보통 이 엔드포인트가
        필요 없습니다. 다만 `templateItemHighlight` 의 이미지처럼 본문과 따로
        올려야 하는 경우가 있어 함께 엽니다.

        ### 유형

        | type | 필드 | 최대 | 쓰임 |
        | --- | --- | --- | --- |
        | `alimtalk` | `image` | 1 | 알림톡 본문 이미지 |
        | `alimtalk_highlight` | `image` | 1 | 알림톡 아이템 하이라이트 |
        | `default` | `image` | 1 | 브랜드메시지 기본 이미지 (FI) |
        | `wide` | `image` | 1 | 와이드 이미지 (FW) |
        | `wide_item_list_first` | `image` | 1 | 와이드 아이템 리스트 대표 (FL) |
        | `wide_item_list` | `images[]` | 4 | FL 의 2~4번째 항목 |
        | `carousel_feed` | `images[]` | 10 | 캐러셀 피드 (FC) |
        | `carousel_commerce` | `images[]` | 11 | 캐러셀 커머스 (FA) |
      operationId: uploadKakaoImage
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum:
              - alimtalk
              - alimtalk_highlight
              - default
              - wide
              - wide_item_list_first
              - wide_item_list
              - carousel_feed
              - carousel_commerce
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: 단일 유형에서 사용. jpg/png, 2MB 이하
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: 다중 유형에서 사용. 유형별 최대 개수가 다릅니다
      responses:
        '201':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TeamRequired'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /{version}/rejected-numbers:
    get:
      tags: [수신거부]
      summary: 수신거부(080) 번호 목록
      description: |
        광고성 메시지는 수신거부한 번호로 보내면 안 됩니다. 발송 API 가 알아서
        제외하지만, **자기 DB 의 수신 상태도 맞춰야** 합니다 — 그러지 않으면
        매번 보내고 매번 걸러지는 것을 반복하고, 자기 화면에서는 여전히
        "수신 동의" 로 보입니다.

        `since` 로 증분만 가져갈 수 있습니다. 전체를 매번 받으면 번호가 쌓일수록
        무거워집니다.

        조회 전용입니다 — 수신거부는 수신자가 ARS·웹으로 직접 하는 것이고
        발송자가 API 로 넣거나 뺄 수 있는 값이 아닙니다.
      operationId: listRejectedNumbers
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - name: since
          in: query
          description: 이 날짜 이후 수신거부된 건만
          schema: { type: string, format: date }
        - name: search
          in: query
          schema: { type: string }
        - name: count
          in: query
          schema: { type: integer, default: 100, maximum: 500 }
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /{version}/webhook:
    get:
      tags: [웹훅]
      summary: 웹훅 구독 조회
      description: |
        마지막 전송 결과(`lastStatus`, `lastSentAt`)도 함께 줍니다 —
        내 엔드포인트가 실제로 받고 있는지 확인할 수 있어야 합니다.

        시크릿 값은 다시 보여주지 않습니다. 설정 여부만 `hasSecret` 으로 알려줍니다.
      operationId: showWebhook
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [웹훅]
      summary: 웹훅 구독 생성 · 수정
      description: |
        등록·심사는 비동기입니다. 구독해 두면 상태가 바뀔 때마다 밀어 주므로
        폴링하지 않아도 됩니다.

        `secret` 을 생략하면 서버가 만들어 **이 응답에서 한 번만** 돌려줍니다.
        이후 조회에서는 나오지 않으니 받은 값을 저장하세요. 이미 시크릿이
        있는 상태에서 생략하면 기존 값을 유지합니다 — URL 만 바꾸는 호출이
        서명 키를 날리지 않습니다.

        `events` 를 생략하면 **전체 구독**입니다. 이벤트가 늘어도 설정을
        고치지 않아도 됩니다.

        ### 서명 검증

        ```
        expected = hmac_sha256(rawRequestBody, webhookSecret)
        // X-Sendgo-Signature 헤더와 상수 시간 비교
        ```

        **파싱한 뒤 다시 인코딩한 값으로 계산하면 안 됩니다.** 키 순서나
        이스케이프가 조금만 달라도 검증이 깨집니다. 받은 바이트 그대로 쓰세요.

        ### 이벤트

        | 이벤트 | 언제 |
        | --- | --- |
        | `sender.status_changed` | 발신번호 심사 상태 변경 (PENDING → SUCCESS / REJECTED …) |
        | `notice_template.inspection_status_changed` | 알림톡 검수 상태 변경 (REG → REQ → APR / REJ) |
        | `kakao_sender.status_changed` | 채널 차단·휴면·프로필 상태 변경 |
        | `kakao_sender.brand_message_status_changed` | 브랜드메시지 M/N 신청 상태 변경 |

        전송은 실패 시 1분 · 5분 · 15분 · 1시간 간격으로 4회 재시도합니다.
      operationId: updateWebhook
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionRequest'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [웹훅]
      summary: 웹훅 구독 해지
      description: URL 과 시크릿을 지웁니다.
      operationId: deleteWebhook
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /{version}/webhook/test:
    post:
      tags: [웹훅]
      summary: 테스트 이벤트 발송
      description: |
        `webhook.test` 이벤트를 보냅니다. 구독 이벤트 목록에 없어도 도착하므로
        연동 단계에서 엔드포인트와 서명 검증을 확인할 수 있습니다.

        전송은 비동기입니다 — 응답은 큐에 넣었다는 뜻이고, 도착 여부는
        엔드포인트 로그로 확인하세요.
      operationId: testWebhook
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: "`accessKey:secretKey`를 Base64로 인코딩 (토큰 발급 시 사용)"
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        발급받은 토큰 사용
        - v1: `Bearer base64(token)`
        - v2: `Bearer token`
    AgentToken:
      type: http
      scheme: bearer
      description: |
        에이전트 토큰. 계정 API(`/v2/account/*`)와 MCP 서버(`POST /mcp`)에서만
        쓴다.

        애플리케이션 키는 자기 자신을 만들 수 없으므로, 조직 선택과 키 발급에는
        사람 계정에 매달린 자격증명이 필요하다. 콘솔의
        `/applications/agent-tokens` 에서 한 번 발급해 `SENDGO_AGENT_TOKEN` 으로
        넘긴다.

        범위(scope)가 분리되어 있다: `account:read` · `keys:write` ·
        `senders:write` · `templates:write` · `ops:write` · `messages:send`.
        발송 범위가 없는 토큰으로도 셋업은 전부 할 수 있다.

  parameters:
    ShortUrlCode:
      name: code
      in: path
      required: true
      description: 짧은 URL 코드
      schema: { type: string, maxLength: 32 }
      example: k7Rm2xQ
    ApiVersion:
      name: version
      in: path
      required: true
      description: API 버전
      schema:
        type: string
        enum: [v1, v2]
        default: v1
      example: v2
    KakaoSenderKeyPath:
      name: kakaoSenderKey
      in: path
      required: true
      description: 카카오 발신프로필 키
      schema: { type: string }
      example: 8f9b1c2d3e4f5a6b7c8d9e0f
    ApiKeyIdPath:
      name: apiKeyId
      in: path
      required: true
      description: 애플리케이션 키 uuid (`GET /v2/account/api-keys` 의 `id`)
      schema: { type: string }
      example: 1f0a2b3c-4d5e-6f70-8192-a3b4c5d6e7f8
    TemplateCodePath:
      name: templateCode
      in: path
      required: true
      description: 템플릿 코드
      schema: { type: string, maxLength: 30 }
      example: TPL-20260910-0001
    TemplateKeyPath:
      name: templateKey
      in: path
      required: true
      description: 문자 템플릿 키 (uuid)
      schema: { type: string }
    SenderKeyPath:
      name: senderKey
      in: path
      required: true
      description: 발신번호 키 (uuid)
      schema: { type: string }

  schemas:
    KakaoSenderCreateRequest:
      type: object
      required: [token, yellowId, phoneNumber, categoryCode]
      properties:
        token:
          type: string
          description: 1단계에서 관리자 휴대폰으로 받은 인증번호
          example: '123456'
        yellowId:
          type: string
          description: 카카오톡 채널 아이디. `@` 는 있어도 없어도 됩니다.
          example: '@sendgo'
        phoneNumber:
          type: string
          example: '01012345678'
        categoryCode:
          type: string
          description: '`GET /{version}/kakao-senders/categories` 의 코드'
          example: '001001'

    NoticeTemplateRequest:
      type: object
      required:
        - kakaoSenderKey
        - templateName
        - templateContent
        - templateMessageType
        - templateEmphasizeType
        - categoryCode
        - messagePurpose
        - legalBasis
        - benefitOrigin
        - expiryType
        - optInReviewConfirmed
        - ctaClearConfirmed
        - policyConfirmed
      properties:
        kakaoSenderKey:
          type: string
          description: 수정 시에는 무시됩니다 (변경 불가).
        templateName: { type: string, maxLength: 150 }
        templateContent:
          type: string
          maxLength: 1000
          description: '변수는 `#{name}` 형식으로 씁니다.'
          example: "#{name}님, 주문 #{orderNo} 이 접수되었습니다."
        templateMessageType:
          type: string
          enum: [BA, EX, AD, MI]
          description: |
            BA 기본형 / EX 부가정보형 / AD 채널추가형 / MI 복합형.
            EX·MI 는 `templateExtra` 필수, AD·MI 는 `linkType=AC` 버튼 필수.
        templateEmphasizeType:
          type: string
          enum: [NONE, TEXT, ITEM_LIST, IMAGE]
          description: |
            TEXT 는 `templateTitle`·`templateSubtitle` 필수,
            ITEM_LIST 는 `templateItem.list` 필수,
            IMAGE 는 `image` 파일 업로드 필수(multipart).
        categoryCode:
          type: string
          description: 6자리 숫자. `GET /{version}/notice-templates/categories` 참고
          example: '001001'
        templateTitle: { type: string, maxLength: 50, nullable: true }
        templateSubtitle: { type: string, maxLength: 50, nullable: true }
        templateHeader: { type: string, maxLength: 16, nullable: true }
        templateExtra: { type: string, maxLength: 500, nullable: true }
        templateItem: { type: object, nullable: true }
        templateItemHighlight: { type: object, nullable: true }
        templateRepresentLink: { type: object, nullable: true }
        buttons:
          type: array
          nullable: true
          items: { type: object }
        quickReplies:
          type: array
          nullable: true
          items: { type: object }
        securityFlag: { type: boolean, default: false }
        adultFlag: { type: boolean, default: false }
        image:
          type: string
          format: binary
          nullable: true
          description: '`templateEmphasizeType=IMAGE` 일 때 필수. jpg/png, 500KB 이하'
        messagePurpose:
          type: string
          description: 메시지 목적
          enum:
            - order_delivery
            - reservation_booking
            - payment_billing
            - account_auth
            - service_ops
            - policy_notice
            - benefit_notice
            - customer_support
            - other
        legalBasis:
          type: string
          description: 발송 근거
          enum: [transaction, paid_purchase, event_entry, contract, policy_notice]
        benefitOrigin:
          type: string
          description: 혜택 발생 경위. `benefit_notice` 목적이면 `none` 을 쓸 수 없습니다.
          enum: [none, paid, event, contract, promo, free]
        expiryType:
          type: string
          description: 소멸 유형
          enum: [none, rights_based, promo]
        optInReviewConfirmed:
          type: boolean
          description: 사전동의 검토를 마쳤다는 확인. `true` 여야 합니다.
        ctaClearConfirmed:
          type: boolean
          description: 구매·혜택 유도 문구가 없음을 확인. `true` 여야 합니다.
        policyConfirmed:
          type: boolean
          description: 발신자 정책 확인. `true` 여야 검수를 요청할 수 있습니다.

    BrandTemplateRequest:
      type: object
      required: [kakaoSenderKey, templateName, templateType]
      properties:
        kakaoSenderKey:
          type: string
          description: 수정 시에는 무시됩니다 (변경 불가).
        templateName: { type: string, maxLength: 200 }
        templateType:
          type: string
          enum: [FT, FI, FW, FL, FC, FM, FP, FA]
          description: |
            친구톡 표기를 그대로 씁니다. 서버가 chatBubbleType 으로 변환합니다.
            FT 텍스트 / FI 이미지 / FW 와이드 / FL 와이드아이템리스트 /
            FC 캐러셀피드 / FM 커머스 / FP 프리미엄동영상 / FA 캐러셀커머스
        templateContent:
          type: string
          maxLength: 1300
          nullable: true
          description: 'FW·FP 는 76자, FI 는 400자, FT 는 1000자 제한'
        adult: { type: boolean, default: false }
        header: { type: string, maxLength: 100, nullable: true }
        additional_content: { type: string, maxLength: 500, nullable: true }
        imageUrl: { type: string, nullable: true }
        imageLink: { type: string, format: uri, nullable: true }
        buttons:
          type: array
          maxItems: 5
          nullable: true
          items: { type: object }
        coupon: { type: object, nullable: true }
        item: { type: object, nullable: true }
        commerce: { type: object, nullable: true }
        list: { type: array, nullable: true, items: { type: object } }
        head: { type: object, nullable: true }
        tail: { type: object, nullable: true }
        video: { type: object, nullable: true }
        mainWideItem: { type: object, nullable: true }
        subWideItemList: { type: array, nullable: true, items: { type: object } }

    SenderRegistrationRequest:
      type: object
      required: [senderAlias, senderNumberType, phoneE164, csuCertificate]
      properties:
        senderAlias:
          type: string
          maxLength: 20
          description: 계정 안에서 중복될 수 없는 관리용 이름
          example: 고객센터 대표번호
        senderNumberType:
          type: string
          description: |
            전 유형을 API 로 접수할 수 있습니다.
            개인 계정은 `personal_mobile` / `personal_other`,
            기업 계정은 `team_main` / `team_representative_mobile` /
            `team_emp_mobile` / `team_other_company`.
          enum:
            - personal_mobile
            - personal_other
            - team_main
            - team_representative_mobile
            - team_emp_mobile
            - team_other_company
        phoneE164:
          type: string
          description: 숫자와 하이픈만. 서버가 E.164 로 정규화합니다.
          example: '02-1234-5678'
        duplicationReason:
          type: string
          maxLength: 500
          nullable: true
          description: 계정에 같은 번호가 이미 있으면 필수입니다.
        csuCertificate:
          type: string
          format: binary
          description: 통신서비스 이용증명원. jpeg/png/pdf, 5MB 이하
        identityDocument:
          type: string
          format: binary
          description: |
            명의자 신분증 사본. 휴대폰 계열(`personal_mobile`,
            `team_representative_mobile`, `team_emp_mobile`)에 **필수**입니다 —
            콘솔의 PASS 본인인증을 대신해 운영자가 직접 확인합니다.
        acceptanceName:
          type: string
          nullable: true
          description: 수임 담당자 유형. `team_other_company` 필수
          enum: [acceptance_representative, acceptance_employee]
        acceptanceIdCard:
          type: string
          format: binary
          nullable: true
          description: '`team_other_company` 필수'
        delegationName:
          type: string
          nullable: true
          description: 위임 담당자 유형. `team_other_company` 필수
          enum: [delegation_representative, delegation_employee]
        delegationIdCard:
          type: string
          format: binary
          nullable: true
          description: '`team_other_company` 필수'
        delegationBusinessCard:
          type: string
          format: binary
          nullable: true
          description: '`team_other_company` 필수'
        delegationWarrant:
          type: string
          format: binary
          nullable: true
          description: 위임장. `team_other_company` 필수
        delegationEmpCertificate:
          type: string
          format: binary
          nullable: true
          description: '`delegationName=delegation_employee` 일 때 필수'
        delegationReason:
          type: string
          maxLength: 500
          nullable: true
          description: '`team_other_company` 필수'
        empCertificate:
          type: string
          format: binary
          nullable: true
          description: 재직증명서

    WebhookSubscriptionRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            이벤트를 받을 주소. **https 만 허용**합니다 — http 로 받으면
            서명이 있어도 본문이 평문으로 흐릅니다.
          example: https://reseller.example.com/hooks/sendgo
        secret:
          type: string
          minLength: 16
          maxLength: 128
          nullable: true
          description: |
            서명 키. 생략하면 서버가 만들어 이 응답에서 한 번만 돌려줍니다.
            이미 있는 상태에서 생략하면 기존 값을 유지합니다.
        events:
          type: array
          nullable: true
          description: 구독할 이벤트. 생략하면 전체 구독.
          items:
            type: string
            enum:
              - sender.status_changed
              - notice_template.inspection_status_changed
              - kakao_sender.status_changed
              - kakao_sender.brand_message_status_changed
        enabled:
          type: boolean
          default: true

    MessageTemplateRequest:
      type: object
      required: [messageTranType, messageTranMsg]
      properties:
        messageTranType:
          type: string
          enum: [SMS, LMS, MMS]
        messageTranSubject:
          type: string
          maxLength: 40
          nullable: true
          description: LMS·MMS 는 필수. SMS 에 넣으면 발송 시 버려집니다.
        messageTranMsg:
          type: string
          maxLength: 2000
          description: 'SMS 는 90바이트, LMS·MMS 는 2000바이트까지 실제 발송됩니다.'
        isFavorite:
          type: boolean
          default: false
    ShortUrlRequest:
      type: object
      required: [targetUrl]
      properties:
        targetUrl:
          type: string
          format: uri
          maxLength: 2048
          description: 줄일 원본 URL. `http`/`https` 만 허용됩니다.
          example: https://example.com/promotions/summer-sale
        title:
          type: string
          maxLength: 255
          nullable: true
          description: 관리 화면에서 구분하기 위한 이름
          example: 여름 세일 랜딩
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: 이 시각 이후에는 리다이렉트하지 않고 `410 Gone` 을 반환합니다.
          example: '2026-09-30 23:59:59'
        forceNew:
          type: boolean
          default: false
          description: |
            true 면 같은 URL 이라도 새 코드를 만듭니다.
            캠페인별로 반응을 분리해 집계할 때 사용합니다.
    Contact:
      type: object
      required: [contact]
      description: 수신자 정보
      properties:
        contact:
          type: string
          description: 수신자 전화번호 (필수)
          example: "01012345678"
        name:
          type: string
          description: 수신자 이름 (선택)
          example: "홍길동"
        var1:
          type: string
          description: 템플릿 변수 #{var1}
          example: "ORD-20260101-001"
        var2:
          type: string
          description: 템플릿 변수 #{var2}
        var3:
          type: string
          description: 템플릿 변수 #{var3}
        var4:
          type: string
          description: 템플릿 변수 #{var4}
        var5:
          type: string
          description: 템플릿 변수 #{var5}
        var6:
          type: string
          description: 템플릿 변수 #{var6}
        var7:
          type: string
          description: 템플릿 변수 #{var7}
        var8:
          type: string
          description: 템플릿 변수 #{var8}

    AlimtalkRequest:
      type: object
      # senderKey 는 조건부 필수다: `replaceSms: "Y"` 일 때만 검증된다
      # (NoticeCampaignRequest 참고). required 에 넣어 두면 스펙으로 만든
      # 클라이언트와 MCP 도구가 대체 발송을 쓰지 않는 호출에도 발신번호를
      # 요구하게 된다.
      required: [templateCode, contacts, kakaoSenderKey]
      description: 카카오 알림톡 전송 요청
      properties:
        at:
          type: string
          nullable: true
          description: "발송 예약 시각 (null = 즉시). 형식: Y-m-d H:i:s"
          example: "2026-04-01 09:00:00"
        scheduleType:
          type: string
          enum: [DIRECTLY, SCHEDULED]
          default: DIRECTLY
          description: "발송 유형 (DIRECTLY: 즉시, SCHEDULED: 예약)"
        templateCode:
          type: string
          description: Sendgo 콘솔에서 승인받은 알림톡 템플릿 코드 (필수)
          example: "ORDER_CONFIRM_001"
        replaceSms:
          type: string
          enum: ["Y", "N"]
          default: "N"
          description: "알림톡 실패 시 SMS 대체 발송 여부 (Y: 활성화)"
        smsSubject:
          type: string
          nullable: true
          description: 대체 SMS 제목 (replaceSms=Y 일 때 필수)
          example: "[배송 안내]"
        smsContent:
          type: string
          nullable: true
          description: 대체 SMS 내용 (replaceSms=Y 일 때 필수)
        contacts:
          type: array
          description: 수신자 목록 (최소 1명)
          items:
            $ref: '#/components/schemas/Contact'
        kakaoSenderKey:
          type: string
          description: 카카오 발신프로필 키
          example: "your_kakao_sender_key"
        senderKey:
          type: string
          description: "SMS 발신자 키. `replaceSms: \"Y\"` 일 때만 필수다."
          example: "your_sms_sender_key"

    BrandMessageRequest:
      type: object
      required: [kakaoSenderKey, targeting, messageType, friendTemplateUuid]
      description: |
        카카오 브랜드메시지 전송 요청.

        친구톡 요청 필드를 모두 그대로 사용하며, 브랜드메시지 전용으로
        `targeting` 과 `friendTemplateUuid` 가 추가됩니다.
        `contacts` 는 `targeting` 이 `M`/`N`/`I` 일 때만 필요합니다.
      allOf:
        - $ref: '#/components/schemas/FriendtalkRequest'
        - type: object
          properties:
            targeting:
              type: string
              enum: [M, N, I, F]
              description: |
                발송 대상
                - `M`: 채널 친구
                - `N`: 채널 친구가 아닌 수신자
                - `I`: 친구 + 비친구 전체
                - `F`: 수신 동의한 전체 채널 친구 (동보, `contacts` 불필요)
              example: "M"
            friendTemplateUuid:
              type: string
              format: uuid
              description: 브랜드 템플릿 UUID (`templateUuid` 로도 허용)
              example: "9cd5460b-6458-4edc-9b11-c26d3013c340"
            friendGroupKey:
              type: string
              nullable: true
              description: 동보(`F`) 발송 대상 그룹 키
            pushAlarm:
              type: string
              enum: [Y, N]
              default: "Y"
              description: 푸시 알림 여부

    FriendtalkRequest:
      type: object
      required: [content, contacts, kakaoSenderKey, senderKey]
      description: >-
        카카오 친구톡 전송 요청. 친구톡은 2025-12-31 종료되어 카카오 측에서
        브랜드메시지(자유형)로 자동 대체 발송됩니다. 이 스키마 자체는
        `BrandMessageRequest` 의 베이스로도 계속 사용되므로 유지됩니다.
      properties:
        at:
          type: string
          nullable: true
          description: "발송 예약 시각 (null = 즉시)"
        scheduleType:
          type: string
          enum: [DIRECTLY, SCHEDULED]
          default: DIRECTLY
          description: 발송 유형
        messageType:
          type: string
          enum: [FT, FI, FW, FL, FM, FC, FA, FP]
          default: FT
          description: |
            메시지 유형
            - FT: 기본 텍스트
            - FI: 이미지형
            - FW: 와이드 이미지
            - FL: 리스트형
            - FM: 이미지+텍스트
            - FC: 캐러셀
            - FA: 아이템 리스트
            - FP: 프리미엄 동영상
        content:
          type: string
          description: 메시지 본문 (필수)
          example: "안녕하세요! 봄맞이 30% 할인 이벤트가 시작되었습니다."
        buttons:
          type: array
          description: 버튼 목록
          items:
            type: object
        image:
          nullable: true
          description: 이미지 파일 (imageUrl과 둘 중 하나)
        imageUrl:
          type: string
          nullable: true
          description: 이미지 URL (image와 둘 중 하나)
          example: "https://example.com/banner.jpg"
        imageLink:
          type: string
          nullable: true
          description: 이미지 클릭 시 이동할 URL
        adFlag:
          type: string
          enum: ["Y", "N"]
          default: "Y"
          description: "광고성 메시지 여부"
        wide:
          type: string
          enum: ["Y", "N"]
          default: "N"
          description: "와이드 이미지 사용 여부"
        adult:
          type: string
          enum: ["Y", "N"]
          default: "N"
          description: "성인 콘텐츠 여부"
        header:
          type: string
          nullable: true
          description: 헤더 텍스트
        replaceSms:
          type: string
          enum: ["Y", "N"]
          default: "N"
          description: SMS 대체 발송 여부
        smsSubject:
          type: string
          nullable: true
          description: 대체 SMS 제목
        smsContent:
          type: string
          nullable: true
          description: 대체 SMS 내용
        contacts:
          type: array
          description: 수신자 목록
          items:
            $ref: '#/components/schemas/Contact'
        kakaoSenderKey:
          type: string
          description: 카카오 발신프로필 키
        senderKey:
          type: string
          description: SMS 발신자 키

    SmsRequest:
      type: object
      required: [content, contacts, senderKey]
      description: SMS / LMS / MMS 전송 요청
      properties:
        campaignType:
          type: string
          enum: [MESSAGE, ADVERTISE, ELECTION]
          default: MESSAGE
          description: |
            캠페인 유형
            - MESSAGE: 일반 메시지
            - ADVERTISE: 광고성 메시지
            - ELECTION: 선거 관련
        messageType:
          type: string
          enum: [SMS, LMS, MMS]
          default: SMS
          description: |
            메시지 유형
            - SMS: 단문 (90자 이하)
            - LMS: 장문 (2,000자 이하)
            - MMS: 멀티미디어
        scheduleType:
          type: string
          enum: [DIRECTLY, SCHEDULED]
          default: DIRECTLY
          description: 발송 유형
        at:
          type: string
          nullable: true
          description: 발송 예약 시각 (null = 즉시)
        subject:
          type: string
          nullable: true
          description: 메시지 제목 (LMS/MMS에서 사용)
          example: "[공지사항]"
        content:
          type: string
          description: 메시지 본문 (필수)
          example: "인증번호: 123456"
        files:
          type: array
          description: 첨부 파일 목록 (MMS)
          items:
            type: object
        contacts:
          type: array
          description: 수신자 목록
          items:
            $ref: '#/components/schemas/Contact'
        senderKey:
          type: string
          description: SMS 발신자 키
          example: "your_sms_sender_key"

    TokenResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            token:
              type: string
              description: API 액세스 토큰 (유효시간 24시간)
              example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          description: 전송 결과 데이터

    ErrorResponse:
      type: object
      description: API 오류 응답 (v2에서 에러 코드 세분화)
      properties:
        code:
          type: string
          description: 에러 코드
          example: "INVALID_TEMPLATE_CODE"
        message:
          type: string
          description: 에러 메시지
          example: "존재하지 않는 템플릿 코드입니다."

  responses:
    TeamRequired:
      description: 기업(Team) 소유 애플리케이션이 아님
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "TEAM_REQUIRED_FOR_KAKAO"
            message: "Kakao API is only available for team-owned applications."

    UnprocessableEntity:
      description: 요청은 이해했으나 처리할 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validationFailed:
              value:
                code: "VALIDATION_FAILED"
                message: "The given data was invalid."
            kakaoError:
              summary: 카카오/중계사가 거절한 경우 (원문 메시지 그대로 전달)
              value:
                code: "KAKAO_API_ERROR"
                message: "이미 등록된 발신프로필입니다."

    PolicyValidationFailed:
      description: sendgo 메시지 정책 게이트를 통과하지 못함
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            saveBlocked:
              summary: 저장 단계에서 차단
              value:
                code: "POLICY_VALIDATION_FAILED"
                message: "The template violates the sendgo message policy."
                errors:
                  reasons:
                    - "혜택 안내가 아닌 메시지 목적을 선택했지만 혜택성 신호가 감지되었습니다."
            inspectionBlocked:
              summary: 검수 요청 단계에서 차단
              value:
                code: "POLICY_REVIEW_REQUIRED"
                message: "The template has not passed the sendgo policy review yet."
                errors:
                  reasons:
                    - message: "발신자 정책 확인이 완료되지 않았습니다."
                      causes: []

    SenderRegistrationRejected:
      description: 발신번호 등록 신청이 거절됨
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missingIdentityDocument:
              summary: 휴대폰 유형인데 신분증 사본이 없음
              value:
                code: "VALIDATION_FAILED"
                message: "The given data was invalid."
                errors:
                  identityDocument:
                    - "The identity document field is required."
            duplicationReason:
              value:
                code: "DUPLICATION_REASON_REQUIRED"
                message: "This number is already registered for the account; duplicationReason is required."
            aliasTaken:
              value:
                code: "SENDER_ALIAS_TAKEN"
                message: "senderAlias is already in use."
            typeMismatch:
              value:
                code: "SENDER_TYPE_OWNER_MISMATCH"
                message: "Sender number type 'team_main' requires a team-owned application."
    SuccessResponse:
      description: 전송 성공
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'

    ValidationFailed:
      description: 입력값 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "VALIDATION_FAILED"
            message: "The given data was invalid."
            errors:
              targetUrl:
                - "The target url field must be a valid URL."

    BadRequest:
      description: 잘못된 요청 (파라미터 누락/형식 오류)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            emptyContacts:
              value:
                code: "EMPTY_CONTACTS"
                message: "수신자 정보가 비어있습니다."
            invalidTemplate:
              value:
                code: "INVALID_TEMPLATE_CODE"
                message: "존재하지 않는 템플릿 코드입니다."

    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidKey:
              value:
                code: "INVALID_ACCESS_KEY"
                message: "유효하지 않은 액세스 키입니다."

    Forbidden:
      description: 권한 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notApproved:
              value:
                code: "ACCESS_KEY_NOT_APPROVED"
                message: "승인되지 않은 앱입니다."
            ipNotAllowed:
              value:
                code: "IP_NOT_ALLOWED"
                message: "허용되지 않은 IP입니다."

    PaymentRequired:
      description: 크레딧 부족
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "PAYMENT_REQUIRED"
            message: "크레딧이 부족합니다."

    NotFound:
      description: 대상을 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            campaignNotFound:
              value:
                code: "NOT_FOUND"
                message: "캠페인을 찾을 수 없습니다."
            kakaoSenderNotFound:
              value:
                code: "INVALID_KAKAO_SENDER_KEY"
                message: "Incorrect kakaoSenderKey"
