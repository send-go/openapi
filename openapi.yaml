  /{version}/senders:
    get:
      tags: [발신번호]
      summary: 발신번호 목록
      operationId: listSenders
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [발신번호]
      summary: 발신번호 등록 신청
      description: |
        서류 첨부가 있으므로 `multipart/form-data` 로 보냅니다. 등록하면 바로
        쓸 수 있는 게 아니라 `PENDING` 으로 **접수**되고, 운영자 승인 후
        `SUCCESS` 가 됩니다. 상태는 `GET /{version}/senders` 로 확인하거나
        `sender.status_changed` 웹훅으로 받습니다.

        ### 본인확인을 어떻게 대신하나

        콘솔은 휴대폰 계열(`personal_mobile`, `team_representative_mobile`,
        `team_emp_mobile`)에 **PASS 본인인증**을 요구합니다. API 에는 그 화면이
        없으므로 **신분증 사본(`identityDocument`)을 받아 운영자가 직접
        확인**합니다. 모든 유형을 API 로 접수할 수 있습니다.

        이 경로로 접수된 건은 `identityVerificationMethod: "document"` 로
        표시되고 **자동 승인되지 않습니다.** 운영자 확인 전까지 `PENDING` 입니다.

        유형별 필수 서류는 `GET /{version}/senders/number-types` 로 확인하세요.
      operationId: createSender
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SenderRegistrationRequest'
      responses:
        '201':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/SenderRegistrationRejected'

  /{version}/senders/number-types:
    get:
      tags: [발신번호]
      summary: 발신번호 유형과 필수 서류 안내
      description: |
        계정 종류(개인/기업)에 맞는 발신번호 유형과, 유형별로 첨부해야 하는
        서류를 알려줍니다. `apiRegistrable: false` 인 유형은 휴대폰 본인인증이
        필요해 API 로 접수할 수 없습니다.
      operationId: listSenderNumberTypes
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /{version}/senders/validate:
    post:
      tags: [발신번호]
      summary: 발신번호 등록 전 중복·형식 확인
      description: |
        같은 번호가 이미 있으면 등록은 가능하되 `duplicationReason` 이 필수가
        됩니다. 응답의 `duplicationReasonRequired` 로 미리 판단하세요.
      operationId: validateSenderNumber
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneE164, senderNumberType]
              properties:
                phoneE164:
                  type: string
                  example: '021234567'
                senderNumberType:
                  type: string
                  enum:
                    - personal_mobile
                    - personal_other
                    - team_main
                    - team_representative_mobile
                    - team_emp_mobile
                    - team_other_company
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /{version}/senders/{senderKey}:
    patch:
      tags: [발신번호]
      summary: 발신번호 별칭·기본발신 변경
      description: 번호 자체와 심사 상태는 바꿀 수 없습니다.
      operationId: updateSender
