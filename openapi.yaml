      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TeamRequired'

  /{version}/kakao-senders/sync:
    post:
      tags: [발신프로필]
      summary: 전체 발신프로필 동기화
      description: |
        기업의 모든 발신프로필 상태(차단·휴면·프로필 상태)를 카카오에서 다시 읽습니다.
        일부 채널이 실패해도 나머지는 갱신하며, 실패분은 `data.failed` 에 담깁니다.
      operationId: syncAllKakaoSenders
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      security:
