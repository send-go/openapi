    post:
      tags: [브랜드메시지템플릿]
      summary: 브랜드메시지 템플릿 등록
      description: |
        알림톡 템플릿과 달리 **검수 요청 단계가 없습니다.** 등록하면 카카오가
        바로 상태를 돌려주고, 그 값이 `status` 로 노출됩니다.

        `templateType` 은 친구톡 표기(`FT`/`FI`/`FW`/`FL`/`FC`/`FM`/`FP`/`FA`)를
        그대로 씁니다. 서버가 `chatBubbleType`(TEXT/IMAGE/WIDE/...) 으로 변환합니다.

        동보 발송(`targeting=F`)에는 **변수가 없는 템플릿만** 쓸 수 있습니다.
        응답의 `containsVariables` 로 미리 확인하세요.
      operationId: createBrandTemplate
