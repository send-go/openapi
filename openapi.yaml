      description: '아직 발송하지 않습니다. 직접 작성한 content 또는 저장한 template_id 중 하나와 수신자 최대 100명을 고정한 초안을 만듭니다. 직접 작성한 초안은 content_source=inline, template_id=null로 조회됩니다. 직접 입력한 recipient_emails, 공통 연락처 UUID address_book_contact_ids 또는 기존 숫자 contact_ids 중 하나를 전달합니다. 직접 입력은 동의를 생성하지 않으며 미동의 주소는 견적에서 제외 사유와 함께 반환합니다. 공통 연락처의 현재 이름·이메일·전화번호·var1~var8, 동의와 수신거부를 견적·발송 때 다시 검사합니다.'
      operationId: createEmailCampaign
      parameters:
        -
          name: version
          in: path
          required: true
          schema:
            type: string
            enum:
              - v2
            default: v2
      security:
        -
          BearerAuth: []
      responses:
        '200':
          description: '요청 결과. 상태값과 사용 가능 여부를 확인하세요.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: '입력 또는 발송 조건을 확인하세요.'
        '503':
          description: '서비스 준비 중 또는 일시 중지 상태입니다.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - required: [template_id]
                - required: [content]
              properties:
                name:
                  type: string
                  maxLength: 100
                template_id:
                  type: string
                  format: uuid
                content:
                  type: object
                  description: '템플릿 저장 없이 작성할 본문. template_id와 함께 사용할 수 없습니다.'
                  additionalProperties: false
                  required: [subject]
                  anyOf:
                    - required: [text_body]
                    - required: [html_body]
                  properties:
                    subject:
                      type: string
                      maxLength: 998
                    text_body:
                      type: string
                      maxLength: 200000
                    html_body:
                      type: string
                      maxLength: 200000
                sender_profile_id:
                  type: string
                  format: uuid
                  description: 회사 프로필의 발신 정보를 초안에 고정합니다. 함께 보낸 from 및 sender 필드보다 우선합니다.
                from:
                  type: string
                  format: email
                  maxLength: 254
                recipient_emails:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: {type: string, format: email, maxLength: 254}
                  description: 직접 입력한 이메일 목록. 주소록 ID 목록과 함께 보낼 수 없습니다. 주소별 기존 동의·수신 거부를 조회하며 동의를 새로 만들지 않습니다.
                address_book_contact_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: {type: string, format: uuid}
                contact_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: integer
                variables:
                  type: object
                  additionalProperties:
                    type: string
                    maxLength: 1000
                sender_name:
                  type: string
                  maxLength: 100
                sender_address:
                  type: string
                  maxLength: 500
                sender_contact:
                  type: string
                  format: email
                  maxLength: 254
              allOf:
                - oneOf:
                    - required: [recipient_emails]
                    - required: [address_book_contact_ids]
                    - required: [contact_ids]
                - anyOf:
                    - required: [sender_profile_id]
                    - required: [from, sender_name, sender_address, sender_contact]
              required:
                - name
